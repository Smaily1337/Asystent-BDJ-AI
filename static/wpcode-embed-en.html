<!--
  WPCode — Dragon AI (ENGLISH)
  ────────────────────────────
  Nazwa snippetu:  Dragon AI — EN
  Typ:              HTML Snippet
  Lokalizacja:      Site Wide Footer (cała witryna)
  Warunek (Pro):    Page URL  →  contains  →  /en/
-->
<script>
/**
 * Dragon AI — osadzenie WP (inline / embed.js)
 * Przycisk montowany na document.body — poza stacking context stopki.
 * Na telefonie chat = pełny ekran (bez zooma / uciętego UI).
 */
(function () {
  if (window.__bdjAiEmbedLoaded) return;
  window.__bdjAiEmbedLoaded = true;

  var BASE = "https://asystent-bdj-ai.onrender.com";
  var EMBED_VERSION = "0.0.19";

  // Usuń stare atrapy z WPCode (w stopce)
  ["bdj-ai-fab", "bdj-ai-tip", "bdj-ai-embed", "bdj-ai-widget"].forEach(function (id) {
    var el = document.getElementById(id);
    if (el) el.remove();
  });

  var style = document.createElement("style");
  style.textContent = [
    "#bdj-ai-fab{position:fixed!important;bottom:28px!important;right:28px!important;width:60px!important;height:60px!important;",
    "border:1px solid rgba(255,255,255,.18)!important;border-radius:50%!important;padding:0!important;margin:0!important;",
    "background:linear-gradient(145deg,rgba(15,23,42,.92),rgba(30,41,59,.88))!important;color:#fff!important;cursor:pointer!important;",
    "z-index:2147483647!important;box-shadow:0 12px 32px rgba(15,23,42,.28)!important;",
    "display:flex!important;align-items:center!important;justify-content:center!important;pointer-events:auto!important;touch-action:manipulation!important;}",
    "#bdj-ai-fab.is-chat-open{display:none!important;}",
    "#bdj-ai-fab svg{width:26px;height:26px;pointer-events:none;}",
    "#bdj-ai-tip{position:fixed!important;bottom:100px!important;right:28px!important;max-width:min(300px,calc(100vw - 100px));",
    "z-index:2147483647!important;background:rgba(255,255,255,.95)!important;border:1px solid rgba(15,23,42,.08)!important;",
    "border-radius:18px!important;padding:12px 14px!important;box-shadow:0 16px 36px rgba(15,23,42,.18)!important;",
    "cursor:pointer!important;font-family:system-ui,sans-serif!important;pointer-events:auto!important;display:none;touch-action:manipulation!important;}",
    "#bdj-ai-tip strong{display:block;font-size:14px;color:#0f172a;}",
    "#bdj-ai-tip span{display:block;font-size:13px;color:#64748b;line-height:1.35;margin-top:2px;}",
    "#bdj-ai-tip-close{background:none;border:none;font-size:18px;color:#94a3b8;cursor:pointer;padding:0 2px;pointer-events:auto!important;}",
    "#bdj-ai-embed{position:fixed!important;",
    "bottom:max(24px,env(safe-area-inset-bottom,24px))!important;",
    "right:max(24px,env(safe-area-inset-right,24px))!important;",
    "width:min(420px,calc(100vw - 48px))!important;height:min(720px,calc(100dvh - 48px))!important;",
    "z-index:2147483646!important;background:#fff!important;pointer-events:none!important;border:none!important;",
    "border-radius:24px!important;overflow:hidden!important;",
    "box-shadow:0 20px 48px rgba(15,23,42,.18),0 8px 20px rgba(15,23,42,.08)!important;",
    "opacity:0!important;visibility:hidden!important;transform:translateY(16px) scale(.98)!important;",
    "transition:opacity .2s ease,transform .2s ease,visibility .2s ease!important;}",
    "#bdj-ai-embed.is-open{opacity:1!important;visibility:visible!important;pointer-events:auto!important;transform:translateY(0) scale(1)!important;}",
    "#bdj-ai-widget{width:100%!important;height:100%!important;border:0!important;background:transparent!important;}",
    "#bdj-ai-loader{position:absolute!important;inset:0!important;display:flex!important;flex-direction:column!important;align-items:center!important;justify-content:center!important;background:#ffffff!important;z-index:2!important;font-family:system-ui,-apple-system,sans-serif!important;color:#142b3a!important;gap:12px!important;transition:opacity .25s ease!important;}",
    "#bdj-ai-loader.is-hidden{opacity:0!important;pointer-events:none!important;}",
    ".bdj-spinner{width:32px!important;height:32px!important;border:3px solid #e6edf1!important;border-top-color:#009cc7!important;border-radius:50%!important;animation:bdjSpin .75s linear infinite!important;}",
    "@keyframes bdjSpin{to{transform:rotate(360deg)}}",
    "@media (max-width:680px){",
    "body.bdj-ai-chat-open{overflow:hidden!important;}",
    "#bdj-ai-fab{bottom:max(18px,env(safe-area-inset-bottom,18px))!important;right:max(18px,env(safe-area-inset-right,18px))!important;}",
    "#bdj-ai-tip{bottom:calc(88px + env(safe-area-inset-bottom,0px))!important;right:max(16px,env(safe-area-inset-right,16px))!important;}",
    "#bdj-ai-embed.is-open{inset:0!important;top:0!important;right:0!important;bottom:0!important;left:0!important;",
    "width:100%!important;height:100%!important;height:100dvh!important;max-width:none!important;max-height:none!important;",
    "border-radius:0!important;box-shadow:none!important;background:#fff!important;transform:none!important;}",
    "}",
  ].join("");

  var fab = document.createElement("button");
  fab.id = "bdj-ai-fab";
  fab.type = "button";
  fab.setAttribute("aria-label", "Dragon AI");
  fab.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path><circle cx="8.5" cy="10.5" r="1" fill="currentColor" stroke="none"></circle><circle cx="12" cy="10.5" r="1" fill="currentColor" stroke="none"></circle><circle cx="15.5" cy="10.5" r="1" fill="currentColor" stroke="none"></circle></svg>';

  var PAGE_LANG = "en";

  var tip = document.createElement("div");
  tip.id = "bdj-ai-tip";
  var tipText = "Hi! I can help you pick spare parts 😊";
  var tipClose = "Close";
  tip.innerHTML = '<div style="display:flex;gap:10px;align-items:flex-start;"><div style="flex:1;min-width:0;"><strong>DRAGON AI</strong><span>' + tipText + '</span></div><button id="bdj-ai-tip-close" type="button" aria-label="' + tipClose + '">&times;</button></div>';

  var wrap = document.createElement("div");
  wrap.id = "bdj-ai-embed";
  var loader = document.createElement("div");
  loader.id = "bdj-ai-loader";
  loader.innerHTML = '<div class="bdj-spinner"></div><div id="bdj-ai-loader-text" style="font-size:13px;font-weight:600;color:#142b3a;letter-spacing:-0.01em;">Dragon AI</div>';
  wrap.appendChild(loader);
  var frame = document.createElement("iframe");
  frame.id = "bdj-ai-widget";
  frame.title = "Dragon AI";
  frame.allow = "clipboard-write";
  frame.setAttribute("allowfullscreen", "true");
  wrap.appendChild(frame);

  var loaderSafetyTimer = null;
  function hideLoader() {
    if (loaderSafetyTimer) {
      clearTimeout(loaderSafetyTimer);
      loaderSafetyTimer = null;
    }
    if (loader) {
      loader.classList.add("is-hidden");
      setTimeout(function () { if (loader && loader.parentNode) loader.style.display = "none"; }, 300);
    }
  }

  function showLoader() {
    if (loader) {
      loader.style.display = "flex";
      loader.classList.remove("is-hidden");
      if (loaderSafetyTimer) clearTimeout(loaderSafetyTimer);
      loaderSafetyTimer = setTimeout(function () {
        hideLoader();
      }, 7000);
    }
  }

  var ready = false;
  var wantOpen = false;
  var loaded = false;

  function hideTip() { tip.style.display = "none"; }

  function showChat() {
    hideTip();
    fab.classList.add("is-chat-open");
    wrap.classList.add("is-open");
    document.body.classList.add("bdj-ai-chat-open");
  }

  function hideChat() {
    fab.classList.remove("is-chat-open");
    wrap.classList.remove("is-open");
    document.body.classList.remove("bdj-ai-chat-open");
    wantOpen = false;
  }

  function sendOpen() {
    if (!frame.contentWindow) return;
    try { frame.contentWindow.postMessage({ type: "bdj-ai-command", action: "open" }, "*"); } catch (e) {}
  }

  function openChat() {
    wantOpen = true;
    showChat();
    ensureFrame();
    if (!ready) {
      showLoader();
    }
    sendOpen();
  }

  function ensureFrame() {
    if (loaded) {
      sendOpen();
      return;
    }
    loaded = true;
    frame.src = BASE + "/?embed=1&open=1&lang=" + encodeURIComponent(PAGE_LANG) + "&v=" + encodeURIComponent(EMBED_VERSION);
  }

  function forwardOfferToWpForm(data) {
    if (!data || typeof data !== "object") return false;
    var root = document.getElementById("offer-form");
    if (!root) return false;
    var form = root.querySelector("form.wpcf7-form");
    if (!form) return false;
    function setField(name, val) {
      var el = form.querySelector('[name="' + name + '"]');
      if (el && val != null && val !== "") el.value = val;
    }
    var itemLines = (data.items || []).map(function (row) {
      return Array.isArray(row) ? row.filter(Boolean).join(" | ") : String(row);
    }).join("\n");
    var details = [
      data.company ? "Firma: " + data.company : "",
      data.machine ? "Maszyna: " + data.machine : "",
      data.message || "",
      itemLines ? "Pozycje:\n" + itemLines : ""
    ].filter(Boolean).join("\n\n");
    setField("your-email", data.email);
    setField("your-phone", data.phone);
    setField("calc01", data.machine || data.company || "");
    setField("calc02", details);
    setField("products-list", itemLines || details);
    var btn = form.querySelector('input[type="submit"], button[type="submit"]');
    if (btn) {
      try { btn.click(); return true; } catch (e) {}
    }
    root.scrollIntoView({ behavior: "smooth", block: "center" });
    return true;
  }

  function mount() {
    document.head.appendChild(style);
    document.body.appendChild(fab);
    document.body.appendChild(tip);
    document.body.appendChild(wrap);

    setTimeout(ensureFrame, 300);
    frame.addEventListener("load", function () {
      setTimeout(function () {
        hideLoader();
      }, 1200);
      if (wantOpen) {
        setTimeout(function () { ready = true; sendOpen(); }, 80);
      }
    });
    setTimeout(function () {
      if (!ready && loader) {
        var txt = document.getElementById("bdj-ai-loader-text");
        if (txt) txt.textContent = "Connecting Dragon AI...";
      }
    }, 4500);
    setTimeout(function () {
      if (!wrap.classList.contains("is-open")) tip.style.display = "block";
    }, 3000);

    fab.addEventListener("click", function (e) {
      e.preventDefault();
      e.stopPropagation();
      openChat();
    });
    tip.addEventListener("click", function (e) {
      e.preventDefault();
      e.stopPropagation();
      if (e.target && e.target.id === "bdj-ai-tip-close") {
        hideTip();
        return;
      }
      openChat();
    });

    window.addEventListener("message", function (e) {
      if (!e.data || typeof e.data !== "object") return;
      if (e.data.type === "bdj-ai-ready") {
        ready = true;
        hideLoader();
        if (wantOpen) {
          try { frame.contentWindow.postMessage({ type: "bdj-ai-command", action: "open" }, "*"); } catch (err) {}
        }
      }
      if (e.data.type === "bdj-ai-resize") {
        if (e.data.open === false) hideChat();
      }
      if (e.data.type === "bdj-ai-offer") {
        forwardOfferToWpForm(e.data);
      }
    });
  }

  if (document.body) mount();
  else document.addEventListener("DOMContentLoaded", mount);
})();
</script>
