<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Blue Dragon Jet | Konfigurator Części Pro</title>
    <script>
    (function () {
        var NEED = '0.0.14';
        if (!/[?&]embed=1(?:&|$)/.test(location.search)) return;
        var p = new URLSearchParams(location.search);
        if (p.get('v') === NEED) return;
        p.set('v', NEED);
        location.replace(location.pathname + '?' + p.toString());
    })();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/marked@4.3.0/marked.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
    <style>

        :root {
            /* Czysty, nowoczesny biały motyw (Clean White / Light Theme) */
            --bg-page: #F8FAFC;
            --bg-widget: #FFFFFF;
            --bg-surface: #FFFFFF;
            --bg-surface-subtle: #F8FAFC;
            --bg-surface-hover: #F1F5F9;
            --bg-input: #FFFFFF;
            
            /* Firmowy błękit BDJ */
            --brand-primary: #0066FF;
            --brand-primary-hover: #0052CC;
            --brand-accent: #0066FF;
            --blue-subtle: #EFF6FF;
            --blue-border: #BFDBFE;
            
            /* Czyste, delikatne krawędzie */
            --border-subtle: #E2E8F0;
            --border-strong: #CBD5E1;
            --border-focus: #0066FF;
            --border-light: #E2E8F0;
            
            /* Kontrastowa, czytelna typografia */
            --text-dark: #0F172A;
            --text-secondary: #475569;
            --text-muted: #64748B;
            --text-dim: #94A3B8;
            
            --shadow-premium: 0 16px 40px -10px rgba(15, 23, 42, 0.12), 0 0 1px rgba(15, 23, 42, 0.15);
            --shadow-card: 0 1px 3px rgba(15, 23, 42, 0.06);
            --font-main: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-main); }
        html, body {
            background: var(--bg-page) !important;
            width: 100%;
            max-width: 100%;
            overflow-x: hidden;
            font-size: 14px;
            color: var(--text-dark);
        }
        body {
            min-height: 100vh;
            min-height: 100dvh;
            background: #F8FAFC !important;
        }

        /* Tryb osadzenia w WordPress / iframe (?embed=1) */
        html.embed-mode,
        html.embed-mode body {
            background: transparent !important;
            min-height: 0 !important;
            height: 100% !important;
            overflow: hidden !important;
        }
        html.embed-mode #fab-btn { z-index: 2147483646; display: none !important; }
        html.embed-mode .fab-tooltip { display: none !important; }
        html.embed-mode #chat-widget {
            z-index: 2147483645;
            background: #FFFFFF !important;
            backdrop-filter: none !important;
            -webkit-backdrop-filter: none !important;
            inset: 0 !important;
            top: 0 !important;
            right: 0 !important;
            bottom: 0 !important;
            left: 0 !important;
            width: 100% !important;
            height: 100% !important;
            max-width: 100% !important;
            max-height: 100% !important;
            border-radius: 0 !important;
            border: none !important;
            box-shadow: none !important;
            opacity: 1;
            transform: none;
            pointer-events: all;
            overscroll-behavior: contain;
        }
        html.embed-mode #chat-widget.open { opacity: 1; transform: none; pointer-events: all; }
        html.embed-mode .modal-overlay { z-index: 2147483647; }

        /* --- FAB BUTTON (Czysty błękit BDJ) --- */
        #fab-btn {
            position: fixed; bottom: 28px; right: 28px; width: 56px; height: 56px;
            background: var(--brand-primary);
            border-radius: 50%;
            box-shadow: 0 8px 24px rgba(0, 102, 255, 0.35);
            display: flex; align-items: center; justify-content: center; color: #FFFFFF;
            cursor: pointer; z-index: 9999;
            border: none;
            outline: none;
            transition: all 0.2s ease;
        }
        #fab-btn:hover { background: var(--brand-primary-hover); transform: translateY(-2px); box-shadow: 0 12px 28px rgba(0, 102, 255, 0.45); }
        #fab-btn:active { transform: translateY(0); }
        #fab-btn svg { width: 22px; height: 22px; }
        #fab-btn .icon-close { display: none; }
        #fab-btn.open .icon-chat { display: none; }
        #fab-btn.open .icon-close { display: block; }

        /* --- GŁÓWNY WIDGET CHATU (CZYSTY BIAŁY) --- */
        #chat-widget {
            position: fixed;
            bottom: 100px;
            right: max(16px, env(safe-area-inset-right, 16px));
            width: min(540px, calc(100vw - 32px));
            height: min(780px, calc(100dvh - 120px));
            max-width: calc(100vw - 32px);
            max-height: calc(100dvh - 80px);
            background: #FFFFFF;
            border-radius: 20px;
            border: 1px solid var(--border-subtle);
            box-shadow: var(--shadow-premium);
            z-index: 9998;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-width: 0;
            opacity: 0;
            transform: translateY(16px);
            pointer-events: none;
            transform-origin: bottom right;
            transition: opacity 0.25s ease, transform 0.25s ease, border-color 0.2s ease;
        }
        #chat-widget.open { opacity: 1; transform: translateY(0); pointer-events: all; }

        /* Dyskretne myślenie AI */
        #chat-widget.thinking-glow {
            border-color: var(--brand-primary);
            box-shadow: var(--shadow-premium), 0 0 0 2px rgba(0, 102, 255, 0.2);
        }

        @media (max-width: 680px) {
            html, body {
                height: 100%;
                height: 100dvh;
                overscroll-behavior: none;
            }
            #chat-widget {
                inset: 0 !important;
                width: 100% !important;
                max-width: 100% !important;
                height: var(--vv-height, 100dvh) !important;
                max-height: var(--vv-height, 100dvh) !important;
                border-radius: 0 !important;
                border: none !important;
                bottom: 0 !important;
                right: 0 !important;
                padding-top: env(safe-area-inset-top, 0px);
                padding-bottom: env(safe-area-inset-bottom, 0px);
            }
            #fab-btn {
                bottom: max(18px, env(safe-area-inset-bottom, 18px));
                right: max(18px, env(safe-area-inset-right, 18px));
                border-radius: 50%;
            }
            #fab-btn.open { display: none; }
            .fab-tooltip { display: none !important; }

            /* iOS: font ≥16px = brak auto-zooma przy focusie */
            #chat-input,
            #machine-select,
            .modal-box input,
            .modal-box textarea,
            .modal-box select {
                font-size: 16px !important;
            }

            html.embed-mode,
            html.embed-mode body {
                height: var(--vv-height, 100%) !important;
                max-height: var(--vv-height, 100%) !important;
            }
            html.embed-mode #chat-widget {
                inset: 0 !important;
                top: 0 !important;
                right: 0 !important;
                bottom: 0 !important;
                left: 0 !important;
                width: 100% !important;
                height: var(--vv-height, 100%) !important;
                max-width: 100% !important;
                max-height: var(--vv-height, 100%) !important;
                border-radius: 0 !important;
                border: none !important;
                box-shadow: none !important;
            }
        }

        @media (max-width: 560px) {
            .btn-reset .reset-label { display: none; }
            .btn-reset { padding: 6px 8px; }
        }

        @media (max-width: 420px) {
            .widget-header { padding: 12px 16px; gap: 8px; }
            .brand-titles .subtitle { display: none; }
            .btn-reset span, .btn-reset .reset-label { display: none; }
            #chat-history { padding: 16px; gap: 14px; }
            .widget-footer { padding: 12px 14px; padding-bottom: max(12px, env(safe-area-inset-bottom, 12px)); }
            .hero-title { font-size: 1.15rem; }
            .hero-machine-line { font-size: 1.1rem; }
        }

        /* --- NAGŁÓWEK KONFIGURATORA --- */
        .widget-header { 
            padding: 14px 20px;
            background: #FFFFFF;
            border-bottom: 1px solid var(--border-subtle);
            display: flex; justify-content: space-between; align-items: center; flex-shrink: 0;
            gap: 12px; min-width: 0;
        }
        .header-brand { display: flex; align-items: center; gap: 12px; min-width: 0; flex: 1; }
        .brand-titles { min-width: 0; overflow: hidden; display: flex; flex-direction: column; gap: 1px; }
        .brand-titles .title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 1rem; font-weight: 600; color: var(--text-dark); letter-spacing: -0.01em; }
        .brand-titles .subtitle { font-size: 0.75rem; font-weight: 500; color: var(--text-muted); display: block; }

        .brand-badge { 
            width: 38px; height: 38px; border-radius: 10px; 
            background: #F1F5F9;
            border: 1px solid var(--border-subtle);
            display: flex; align-items: center; justify-content: center; 
            overflow: hidden; flex-shrink: 0;
        }
        .brand-badge img { width: 100%; height: 100%; object-fit: cover; }

        .app-version {
            display: none;
        }

        .header-actions { display: flex; gap: 8px; align-items: center; flex-shrink: 0; }
        .btn-reset { 
            background: #FFFFFF;
            border: 1px solid var(--border-subtle);
            padding: 6px 12px; 
            border-radius: 8px; cursor: pointer; font-size: 0.75rem; font-weight: 500; 
            color: var(--text-secondary); display: inline-flex; align-items: center; gap: 6px;
            transition: all 0.15s ease;
        }
        .btn-reset:hover { background: #F8FAFC; color: var(--text-dark); border-color: var(--border-strong); }
        .btn-close { 
            background: #FFFFFF; 
            border: 1px solid var(--border-subtle); 
            font-size: 1.1rem; color: var(--text-secondary); 
            cursor: pointer; line-height: 1; padding: 5px 9px; 
            border-radius: 8px; transition: all 0.15s ease; 
        }
        .btn-close:hover { background: #F8FAFC; color: var(--text-dark); border-color: var(--border-strong); }

        /* --- SUB-BAR (WYBÓR MODELU MASZYNY) --- */
        .machine-context-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 18px;
            background: #F8FAFC;
            border-bottom: 1px solid var(--border-subtle);
            flex-shrink: 0;
            min-width: 0;
            transition: all 0.15s ease;
        }
        .machine-context-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 26px;
            height: 26px;
            border-radius: 6px;
            background: #FFFFFF;
            border: 1px solid var(--border-subtle);
            color: var(--text-secondary);
            flex-shrink: 0;
        }
        .machine-context-icon svg { width: 14px; height: 14px; }
        .machine-context-bar.is-selected .machine-context-icon {
            color: var(--brand-primary);
            border-color: var(--blue-border);
            background: var(--blue-subtle);
        }
        .machine-select-wrap {
            flex: 1;
            min-width: 0;
            position: relative;
        }
        .machine-select-wrap::after {
            content: ;
            position: absolute;
            right: 12px;
            top: 50%;
            width: 6px;
            height: 6px;
            border-right: 2px solid var(--text-muted);
            border-bottom: 2px solid var(--text-muted);
            transform: translateY(-65%) rotate(45deg);
            pointer-events: none;
        }
        #machine-select {
            width: 100%;
            min-width: 0;
            height: 32px;
            min-height: 32px;
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            padding: 0 28px 0 10px;
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--text-dark);
            background: #FFFFFF;
            outline: none;
            cursor: pointer;
            appearance: none;
            -webkit-appearance: none;
            transition: border-color 0.15s ease;
        }
        #machine-select:focus {
            border-color: var(--brand-primary);
        }
        #machine-select option {
            background: #FFFFFF;
            color: var(--text-dark);
        }

        /* --- OBSZAR WIADOMOŚCI I KATALOGU --- */
        #chat-history { 
            flex: 1 1 auto;
            min-height: 0;
            min-width: 0;
            overflow-y: auto;
            overflow-x: hidden;
            overscroll-behavior: contain;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            scroll-behavior: smooth;
            background: #F8FAFC;
            -webkit-overflow-scrolling: touch;
        }
        #chat-history::-webkit-scrollbar { width: 5px; }
        #chat-history::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 4px; }
        #chat-history::-webkit-scrollbar-thumb:hover { background: #94A3B8; }

        /* BANNER POCZĄTKOWY (Czysty, biały) */
        .hero-banner {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            margin: auto 0;
            padding: min(8vh, 48px) 12px 20px;
            max-width: 100%;
            min-width: 0;
            flex: 1;
        }
        .hero-title-row {
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            justify-content: center;
            gap: 0.35em;
            margin-bottom: 10px;
            line-height: 1.2;
        }
        .hero-gradient-static {
            font-size: 1.35rem;
            font-weight: 700;
            color: var(--text-dark);
            letter-spacing: -0.02em;
        }
        .hero-gradient-text {
            color: var(--brand-primary);
            font-size: 1.35rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }
        .hero-machine-line {
            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: 12px;
            color: var(--text-secondary);
            text-align: center;
        }
        .hero-machine-name {
            color: var(--brand-primary);
            font-weight: 700;
        }
        .hero-subtitle {
            font-size: 0.88rem;
            color: var(--text-muted);
            margin-bottom: 6px;
            line-height: 1.5;
            max-width: 40ch;
            text-align: center;
        }
        .hero-hint {
            font-size: 0.78rem;
            color: var(--text-dim);
            line-height: 1.45;
            text-align: center;
        }

        /* --- KARTY MASZYN --- */
        .machine-cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 10px;
            margin: 12px 0 4px;
            width: 100%;
        }
        .machine-card {
            display: flex;
            flex-direction: column;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border-subtle);
            background: #FFFFFF;
            text-decoration: none;
            color: inherit;
            box-shadow: 0 1px 3px rgba(15, 23, 42, 0.04);
            transition: all 0.15s ease;
        }
        button.machine-card {
            cursor: pointer;
            text-align: left;
            font: inherit;
            width: 100%;
            padding: 0;
            appearance: none;
            -webkit-appearance: none;
        }
        .machine-card:hover {
            border-color: var(--border-strong);
            background: #FFFFFF;
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.08);
            transform: translateY(-1px);
        }
        .machine-card.is-selected {
            border-color: var(--brand-primary);
            background: var(--blue-subtle);
        }
        .machine-card-ext-link {
            position: absolute;
            top: 6px;
            right: 6px;
            z-index: 2;
            width: 24px;
            height: 24px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #FFFFFF;
            border: 1px solid var(--border-subtle);
            color: var(--brand-primary);
            font-size: 0.75rem;
            font-weight: 700;
            text-decoration: none;
        }
        .machine-card-ext-link:hover {
            background: #F1F5F9;
        }
        .machine-card--pick {
            position: relative;
        }
        .machine-card img {
            width: 100%;
            aspect-ratio: 4 / 3;
            object-fit: cover;
            background: #F1F5F9;
        }
        .machine-card-body {
            padding: 10px 12px;
        }
        .machine-card-title {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-dark);
            line-height: 1.25;
            margin-bottom: 4px;
        }
        .machine-card-tagline {
            font-size: 0.7rem;
            color: var(--text-muted);
            line-height: 1.35;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .machine-card-link,
        .machine-card-hint {
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--brand-primary);
            margin-top: 6px;
        }
        .machine-card-pdf-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            width: 100%;
            margin-top: 8px;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-dark);
            text-decoration: none;
            background: #F8FAFC;
            border: 1px solid var(--border-subtle);
            transition: all 0.15s ease;
        }
        .machine-card-pdf-link:hover {
            background: #F1F5F9;
            border-color: var(--border-strong);
        }
        .btn-product-card {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            margin-top: 14px;
            padding: 12px 18px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.88rem;
            text-decoration: none;
            color: #FFFFFF;
            background: var(--brand-primary);
            border: none;
            transition: all 0.15s ease;
            cursor: pointer;
        }
        .btn-product-card:hover {
            background: var(--brand-primary-hover);
        }
        .machine-cards-catalog-link {
            display: inline-block;
            margin-top: 8px;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--brand-primary);
            text-decoration: none;
        }
        .catalog-trust-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 8px;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.68rem;
            font-weight: 600;
            color: var(--text-secondary);
            background: #F1F5F9;
            border: 1px solid var(--border-subtle);
        }

        /* --- KARTY WIADOMOŚCI --- */
        .msg-row {
            display: flex;
            gap: 10px;
            width: 100%;
            max-width: 100%;
            min-width: 0;
            animation: fadeIn 0.2s ease forwards;
        }
        .msg-row.user { align-self: flex-end; flex-direction: row-reverse; max-width: 85%; }
        .msg-row.bot {
            align-self: flex-start;
            max-width: 100%;
            flex-direction: column;
            align-items: flex-start;
            gap: 6px;
        }
        
        .avatar { 
            width: 30px; height: 30px; border-radius: 8px; 
            background: #FFFFFF;
            border: 1px solid var(--border-subtle);
            display: flex; align-items: center; justify-content: center; 
            flex-shrink: 0; overflow: hidden;
            box-shadow: 0 1px 2px rgba(15, 23, 42, 0.05);
        }
        .msg-row.user .avatar { display: none; margin-bottom: 2px; align-self: flex-end; }
        .avatar img { width: 100%; height: 100%; object-fit: cover; }
        
        .bubble {
            padding: 13px 16px; border-radius: 14px; font-size: 0.92rem; line-height: 1.55; 
            color: var(--text-dark);
            background: #FFFFFF;
            border: 1px solid var(--border-subtle);
            box-shadow: 0 1px 3px rgba(15, 23, 42, 0.04);
            word-wrap: break-word;
            overflow-wrap: anywhere;
            word-break: break-word;
            min-width: 0;
            max-width: 100%;
        }
        .bubble img, .bubble video, .bubble iframe { max-width: 100%; height: auto; }
        .bubble pre, .bubble code { white-space: pre-wrap; word-break: break-word; }
        .msg-row.user .bubble { 
            background: var(--brand-primary);
            color: #FFFFFF;
            border: none;
            box-shadow: 0 2px 8px rgba(0, 102, 255, 0.2);
            border-bottom-right-radius: 4px;
        }
        .msg-row.bot .bubble {
            border-bottom-left-radius: 4px;
            width: 100%;
            max-width: 100%;
            padding: 16px 18px;
            line-height: 1.6;
        }
        .bot-bubble.streaming {
            min-height: 40px;
        }
        .typing-inline {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            margin-top: 8px;
            color: var(--text-muted);
        }
        .typing-inline span {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: currentColor;
            animation: bounce 1.2s infinite ease-in-out;
        }
        .typing-inline span:nth-child(2) { animation-delay: 0.15s; }
        .typing-inline span:nth-child(3) { animation-delay: 0.3s; }

        .typing-cursor {
            display: inline-block;
            width: 6px;
            height: 14px;
            background: var(--brand-primary);
            border-radius: 2px;
            margin-left: 3px;
            vertical-align: -2px;
            animation: blink-cursor 0.75s infinite ease-in-out;
        }
        @keyframes blink-cursor {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* --- TYPOGRAFIA ODPOWIEDZI BOTA --- */
        .bot-md { color: var(--text-dark); font-size: 0.92rem; }
        .bot-md > *:first-child { margin-top: 0; }
        .bot-md > *:last-child { margin-bottom: 0; }
        .bot-md > * + * { margin-top: 12px; }
        .bot-md p {
            margin: 0;
            color: #1E293B;
            line-height: 1.65;
        }
        .bot-md p.lead {
            font-size: 0.96rem;
            font-weight: 500;
            color: var(--text-dark);
            line-height: 1.65;
        }
        .bot-md p.section-intro {
            margin-top: 16px;
            padding-top: 12px;
            border-top: 1px solid var(--border-subtle);
            font-weight: 600;
            color: var(--text-dark);
        }
        .bot-md strong {
            color: var(--text-dark);
            font-weight: 600;
        }
        .bot-md h3, .bot-md h4 {
            margin: 16px 0 6px;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--text-secondary);
        }
        .bot-md h3:first-child, .bot-md h4:first-child { margin-top: 0; }
        .bot-md ul, .bot-md ol {
            margin: 6px 0 0;
            padding-left: 20px;
        }
        .bot-md ul li, .bot-md ol li {
            margin: 0 0 6px;
            padding-left: 4px;
            color: #334155;
            line-height: 1.6;
        }
        .bot-md ul li::marker {
            color: var(--brand-primary);
        }
        .bot-md ol li::marker {
            color: var(--text-muted);
            font-weight: 600;
        }
        .bot-md hr {
            border: none;
            height: 1px;
            background: var(--border-subtle);
            margin: 16px 0;
        }
        .bot-md code, .sku-tag {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 4px;
            background: #EFF6FF;
            border: 1px solid #BFDBFE;
            color: #1D4ED8;
            font-family: var(--font-mono);
            font-size: 0.78rem;
            font-weight: 600;
            line-height: 1.35;
            white-space: nowrap;
        }
        .bot-md pre {
            margin: 10px 0;
            padding: 12px 14px;
            border-radius: 8px;
            background: #F8FAFC;
            border: 1px solid var(--border-subtle);
            color: var(--text-dark);
            font-size: 0.82rem;
            font-family: var(--font-mono);
            overflow-x: auto;
        }
        .bot-notice {
            display: block;
            position: relative;
            padding: 12px 14px 12px 40px;
            border-radius: 8px;
            margin: 0 0 12px;
            font-size: 0.88rem;
            line-height: 1.5;
        }
        .bot-notice::before {
            content: "i";
            position: absolute;
            left: 12px;
            top: 12px;
            width: 18px;
            height: 18px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: 700;
            background: #E2E8F0;
            color: #0F172A;
            text-align: center;
        }
        .bot-notice-info {
            background: #F0F9FF;
            border: 1px solid #BAE6FD;
            color: #0369A1;
        }
        .bot-notice-info::before { background: #0284C7; color: #FFFFFF; }
        .bot-notice-warn {
            background: #FEFCE8;
            border: 1px solid #FEF08A;
            color: #854D0E;
        }
        .bot-notice-warn::before { content: "!"; background: #EAB308; color: #FFFFFF; }

        .bot-contact-card {
            margin: 12px 0 0;
            padding: 14px 16px;
            border-radius: 10px;
            background: #F8FAFC;
            border: 1px solid var(--border-subtle);
        }
        .bot-contact-card strong { display: block; margin-bottom: 6px; color: var(--text-dark); }
        .bot-contact-line {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 5px 0;
            color: var(--text-secondary);
            font-size: 0.85rem;
        }

        /* --- LISTA CZĘŚCI I TABELE (CZYSTE, JASNE) --- */
        .parts-list-wrapper {
            width: 100%;
            max-width: 100%;
            margin: 16px 0 6px;
        }
        .parts-section-title {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 2px 0 10px;
            font-size: 0.74rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: var(--text-secondary);
        }
        .parts-card-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .part-card {
            display: block;
            padding: 12px 14px;
            border: 1px solid var(--border-subtle);
            border-radius: 10px;
            background: #FFFFFF;
            cursor: pointer;
            box-shadow: 0 1px 2px rgba(15, 23, 42, 0.03);
            transition: all 0.15s ease;
        }
        .part-card:hover {
            border-color: var(--border-strong);
            background: #F8FAFC;
        }
        .part-card.selected {
            border-color: var(--brand-primary);
            background: var(--blue-subtle);
        }
        .part-card-header {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 4px;
        }
        .part-card-sku {
            flex: 1;
            min-width: 0;
            font-family: var(--font-mono);
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--brand-primary);
            line-height: 1.35;
        }
        .part-card-name {
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-dark);
            line-height: 1.35;
            margin-bottom: 4px;
        }
        .part-card-meta {
            display: flex;
            flex-direction: column;
            gap: 4px;
            font-size: 0.76rem;
            color: var(--text-muted);
            line-height: 1.4;
        }
        .offer-checkbox {
            width: 16px;
            height: 16px;
            margin-top: 1px;
            cursor: pointer;
            accent-color: var(--brand-primary);
            border-radius: 4px;
            flex-shrink: 0;
        }

        /* Tabele informacyjne */
        .table-wrapper {
            width: 100%;
            max-width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            margin: 14px 0;
            border: 1px solid var(--border-subtle);
            border-radius: 10px;
            background: #FFFFFF;
            box-shadow: 0 1px 3px rgba(15, 23, 42, 0.04);
        }
        .table-wrapper::-webkit-scrollbar { height: 4px; }
        .table-wrapper::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 4px; }
        .bubble table { width: max-content; min-width: 100%; border-collapse: collapse; font-size: 0.82rem; }
        .bubble th, .bubble td { padding: 9px 12px; border-bottom: 1px solid var(--border-subtle); text-align: left; vertical-align: top; }
        .bubble th { background: #F8FAFC; font-weight: 600; color: var(--text-secondary); white-space: nowrap; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.03em; }
        .bubble td { max-width: 220px; white-space: normal; word-break: break-word; color: var(--text-dark); }
        .bubble tbody tr:hover { background: #F8FAFC; }
        .bubble tbody tr.selected-row { background: var(--blue-subtle); }

        .btn-quote { 
            background: #FFFFFF;
            color: var(--brand-primary);
            border: 1px solid var(--border-strong);
            padding: 10px 16px; border-radius: 8px; font-weight: 600; font-size: 0.82rem; 
            cursor: pointer; margin-top: 14px; transition: all 0.15s ease;
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            max-width: 100%; text-decoration: none;
        }
        .btn-quote::before {
            content: "→";
            font-size: 0.9rem;
            line-height: 1;
        }
        .btn-quote:hover {
            background: var(--blue-subtle);
            border-color: var(--brand-primary);
        }

        .handoff-card {
            margin-top: 16px;
            padding: 14px 16px;
            border-radius: 10px;
            background: #F8FAFC;
            border: 1px solid var(--border-subtle);
        }
        .handoff-card-title {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-dark);
            margin-bottom: 6px;
        }
        .handoff-card-text {
            font-size: 0.85rem;
            color: var(--text-secondary);
            line-height: 1.5;
            margin-bottom: 12px;
        }
        .handoff-card .btn-quote {
            margin-top: 0;
            width: 100%;
        }

        /* --- BAR WYSYŁANIA OFERTY --- */
        #offer-action-bar { 
            background: #FFFFFF;
            color: var(--text-dark); padding: 10px 18px; 
            display: none; align-items: center; justify-content: space-between; flex-shrink: 0;
            gap: 12px; flex-wrap: wrap;
            border-top: 1px solid var(--border-subtle);
            box-shadow: 0 -4px 16px rgba(15, 23, 42, 0.04);
            animation: slideUp 0.2s ease;
        }
        #offer-action-bar span { font-weight: 500; font-size: 0.82rem; color: var(--text-secondary); min-width: 0; flex: 1; }
        #offer-count {
            background: var(--blue-subtle); color: var(--brand-primary); padding: 2px 7px; border-radius: 4px; font-weight: 700; border: 1px solid var(--blue-border);
        }
        #btn-open-modal { 
            background: var(--brand-primary);
            color: #FFFFFF; border: none; padding: 8px 16px; 
            border-radius: 8px; font-weight: 600; font-size: 0.8rem; cursor: pointer; 
            transition: background 0.15s ease; white-space: nowrap; flex-shrink: 0;
        }
        #btn-open-modal:hover { background: var(--brand-primary-hover); }

        /* --- FOOTER INPUT (CZYSTY BIAŁY) --- */
        .widget-footer { 
            padding: 12px 18px;
            background: #FFFFFF;
            border-top: 1px solid var(--border-subtle);
            flex-shrink: 0; min-width: 0;
            z-index: 2;
        }
        .input-group { 
            display: flex; align-items: center;
            background: #FFFFFF;
            border: 1px solid var(--border-strong);
            border-radius: 10px;
            padding: 6px 10px 6px 14px;
            transition: all 0.15s ease;
            min-width: 0;
        }
        .input-group:focus-within {
            border-color: var(--brand-primary);
            box-shadow: 0 0 0 3px rgba(0, 102, 255, 0.12);
        }
        #chat-input {
            flex: 1 1 auto; min-width: 0; width: 100%;
            border: none; background: transparent; outline: none;
            font-size: 16px;
            resize: none; overflow: hidden; line-height: 1.45;
            min-height: 22px; max-height: 120px; color: var(--text-dark);
            padding: 4px 0; margin: 0;
            -webkit-text-size-adjust: 100%;
        }
        #chat-input::placeholder { color: var(--text-dim); font-size: 0.85rem; }
        #btn-send { 
            width: 32px; height: 32px; border-radius: 8px; border: none; 
            background: var(--brand-primary);
            color: #FFFFFF; display: flex; align-items: center; justify-content: center; 
            cursor: pointer; transition: background 0.15s ease; flex-shrink: 0; margin-left: 8px;
        }
        #btn-send:hover:not(:disabled) { background: var(--brand-primary-hover); }
        #btn-send:disabled { background: #E2E8F0; color: #94A3B8; cursor: default; }

        .disclaimer-text { font-size: 0.68rem; color: var(--text-muted); text-align: center; margin-top: 8px; overflow-wrap: anywhere; padding: 0 4px; }

        /* --- TYPING INDICATOR --- */
        .typing { display: flex; gap: 4px; padding: 6px 4px; align-items: center; }
        .dot { width: 5px; height: 5px; background: var(--text-muted); border-radius: 50%; animation: bounce 1.4s infinite ease-in-out both; }
        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }
        
        /* --- MODAL KONTAKTOWY (CZYSTY BIAŁY DIALOG) --- */
        .modal-overlay { 
            display: none; position: fixed; inset: 0;
            background: rgba(15, 23, 42, 0.45); backdrop-filter: blur(2px); z-index: 10000; justify-content: center; align-items: center; 
            animation: fadeIn 0.15s ease;
            padding: 16px;
            overflow-y: auto;
        }
        .modal-box {
            background: #FFFFFF;
            padding: 24px; border-radius: 16px;
            width: min(420px, 100%); max-width: 100%;
            max-height: calc(100dvh - 32px); overflow-y: auto;
            box-shadow: 0 20px 50px rgba(15, 23, 42, 0.15);
            border: 1px solid var(--border-subtle);
            color: var(--text-dark);
        }
        .phone-row {
            display: flex; gap: 8px; margin-bottom: 12px; min-width: 0;
        }
        .phone-row select {
            width: 125px; min-width: 110px; flex-shrink: 0;
            padding: 10px 8px;
            border: 1px solid var(--border-strong);
            border-radius: 8px;
            background: #FFFFFF;
            font-size: 0.85rem; font-weight: 500; outline: none;
            color: var(--text-dark);
        }
        .phone-row select:focus { border-color: var(--brand-primary); }
        .phone-row input {
            flex: 1; min-width: 0; margin-bottom: 0 !important;
        }
        @media (max-width: 420px) {
            .phone-row { flex-direction: column; }
            .phone-row select { width: 100%; }
            .modal-footer { flex-direction: column-reverse; }
            .modal-footer button { width: 100%; }
        }
        .modal-overlay.open { display: flex; }
        .modal-box h2 { font-size: 1.15rem; font-weight: 600; margin-bottom: 14px; color: var(--text-dark); letter-spacing: -0.01em; }
        #modal-selected-preview { 
            margin-bottom: 16px; font-size: 0.8rem; color: var(--text-secondary);
            background: #F8FAFC;
            border-radius: 8px;
            border: 1px solid var(--border-subtle);
            padding: 10px 14px; max-height: 130px; overflow-y: auto;
        }
        #modal-selected-preview ul { margin-left: 16px; margin-top: 4px; }
        .modal-box input {
            width: 100%; padding: 11px 14px; margin-bottom: 12px;
            border: 1px solid var(--border-strong); border-radius: 8px; outline: none;
            background: #FFFFFF; font-size: 0.9rem; color: var(--text-dark); transition: border-color 0.15s ease;
        }
        .modal-box input:focus { border-color: var(--brand-primary); }
        .modal-box textarea {
            width: 100%; min-height: 90px; padding: 11px 14px; margin-bottom: 12px;
            border: 1px solid var(--border-strong); border-radius: 8px; outline: none;
            background: #FFFFFF; font-size: 0.9rem; line-height: 1.5; resize: vertical;
            font-family: var(--font-main); transition: border-color 0.15s ease; color: var(--text-dark);
        }
        .modal-box textarea:focus { border-color: var(--brand-primary); }
        .modal-field-label {
            display: block; margin: 0 0 6px; font-size: 0.8rem; font-weight: 500; color: var(--text-secondary);
        }
        .modal-footer { display: flex; justify-content: flex-end; gap: 10px; margin-top: 14px; }
        .btn-cancel {
            padding: 9px 18px; border-radius: 8px;
            border: 1px solid var(--border-subtle);
            background: #F8FAFC;
            color: var(--text-secondary); font-weight: 500; cursor: pointer; transition: all 0.15s ease;
        }
        .btn-cancel:hover { background: #F1F5F9; color: var(--text-dark); }
        .btn-submit {
            padding: 9px 20px; border-radius: 8px; border: none;
            background: var(--brand-primary);
            color: #FFFFFF; font-weight: 600; cursor: pointer; transition: background 0.15s ease;
        }
        .btn-submit:hover { background: var(--brand-primary-hover); }

        /* --- FLOATING TOOLTIP --- */
        .fab-tooltip {
            position: fixed;
            bottom: 100px;
            right: max(16px, env(safe-area-inset-right, 16px));
            max-width: min(320px, calc(100vw - 100px));
            background: #FFFFFF;
            border: 1px solid var(--border-subtle);
            border-radius: 14px; padding: 12px 14px;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.1);
            display: flex; align-items: center; gap: 10px;
            z-index: 9997; cursor: pointer;
            opacity: 0; transform: translateY(10px);
            pointer-events: none; transition: all 0.25s ease;
        }
        .tooltip-content { min-width: 0; }
        .tooltip-content span { overflow-wrap: anywhere; }
        .fab-tooltip.show { opacity: 1; transform: translateY(0); pointer-events: all; }
        .fab-tooltip:hover { transform: translateY(-2px); border-color: var(--border-strong); }
        .tooltip-avatar {
            width: 32px; height: 32px; border-radius: 8px;
            background: #F1F5F9;
            border: 1px solid var(--border-subtle);
            flex-shrink: 0; overflow: hidden;
        }
        .tooltip-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .tooltip-content strong { display: block; font-size: 0.85rem; color: var(--text-dark); font-weight: 600; }
        .tooltip-content span { font-size: 0.78rem; color: var(--text-secondary); line-height: 1.3; display: block; }
        #tooltip-close { background: none; border: none; font-size: 1.1rem; color: var(--text-muted); cursor: pointer; padding: 0 2px; margin-left: 4px; align-self: flex-start; line-height: 1; transition: color 0.15s ease; }
        #tooltip-close:hover { color: var(--text-dark); }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); opacity: 0.4; } 40% { transform: scale(1); opacity: 1; } }

    </style>
</head>
<body>
<script>if (/[?&]embed=1(?:&|$)/.test(location.search)) document.documentElement.classList.add('embed-mode');</script>

<!-- FLOATING TOOLTIP / CHMURKA ZACHĘCAJĄCA (Po 3 sekundach) -->
<div id="fab-tooltip" class="fab-tooltip">
    <div class="tooltip-avatar"><img src="avatar.png" alt="Dragon AI" /></div>
    <div class="tooltip-content">
        <strong>DRAGON AI</strong>
        <span>Cześć! Chętnie pomogę Ci w doborze części 😊</span>
    </div>
    <button id="tooltip-close" aria-label="Zamknij">&times;</button>
</div>

<!-- FAB BUTTON -->
<button id="fab-btn" aria-label="Otwórz Konfigurator Części">
    <svg class="icon-chat" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path><circle cx="8.5" cy="10.5" r="1" fill="currentColor" stroke="none"></circle><circle cx="12" cy="10.5" r="1" fill="currentColor" stroke="none"></circle><circle cx="15.5" cy="10.5" r="1" fill="currentColor" stroke="none"></circle></svg>
    <svg class="icon-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
</button>

<!-- WIDGET KONFIGURATORA -->
<div id="chat-widget">
    <header class="widget-header">
        <div class="header-brand">
            <div class="brand-badge"><img src="avatar.png" alt="Dragon AI" /></div>
            <div class="brand-titles">
                <span class="title">DRAGON AI</span>
                <span class="subtitle">Twój wirtualny asystent</span>
                <span class="app-version">0.0.14</span>
            </div>
        </div>
        <div class="header-actions">
            <button class="btn-reset" id="btn-reset" title="Wyczyść historię rozmowy">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" width="14" height="14"><path d="M3 6h18"></path><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                <span class="reset-label">Wyczyść czat</span>
            </button>
            <button class="btn-close" id="btn-close">&times;</button>
        </div>
    </header>

    <div class="machine-context-bar is-empty" id="machine-context-bar">
        <div class="machine-context-icon" id="machine-context-icon" title="Model wdmuchiwarki BDJ" aria-label="Model maszyny">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="14" rx="3"></rect><path d="M7 6V4a1 1 0 0 1 1-1h8a1 1 0 0 1 1 1v2"></path><circle cx="9" cy="13" r="2"></circle><circle cx="15" cy="13" r="2"></circle><path d="M9 13h6"></path></svg>
        </div>
        <div class="machine-select-wrap">
            <select id="machine-select" aria-label="Wybierz model maszyny">
                <option value="">— wybierz model maszyny —</option>
            </select>
        </div>
    </div>

    <main id="chat-history">
        <!-- Renderowane przez JS -->
    </main>

    <div id="offer-action-bar">
        <span>Wybrane części (<b id="offer-count">0</b>):</span>
        <button id="btn-open-modal">Wygeneruj zapytanie</button>
    </div>

    <footer class="widget-footer">
        <div class="input-group">
            <textarea id="chat-input" rows="1" placeholder="Opisz potrzebną część lub podaj model i wymiar..."></textarea>
            <button id="btn-send" disabled>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="18" height="18"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
            </button>
        </div>
        <div class="disclaimer-text"><strong>Rozwiązanie eksperymentalne</strong> — asystent może popełniać błędy; zawsze sprawdź SKU i wymiary przed zamówieniem.</div>
    </footer>
</div>

<!-- MODAL KONTAKTOWY -->
<div class="modal-overlay" id="modal-contact">
    <div class="modal-box">
        <h2>Zapytanie Ofertowe</h2>
        <div id="modal-selected-preview"></div>
        <div id="modal-error-msg" style="display:none; color:#DC2626; background:#FEF2F2; border:1px solid #FECACA; padding:10px 14px; border-radius:8px; font-size:0.85rem; font-weight:500; margin-bottom:14px;"></div>
        <input type="text" id="inp-company" placeholder="Nazwa firmy *" required>
        <input type="email" id="inp-email" placeholder="Adres e-mail (np. jan@firma.pl) *" required>
        <div class="phone-row">
            <select id="inp-country-code">
                <option value="+48" selected>🇵🇱 PL (+48)</option>
                <option value="+49">🇩🇪 DE (+49)</option>
                <option value="+44">🇬🇧 GB (+44)</option>
                <option value="+420">🇨🇿 CZ (+420)</option>
                <option value="+421">🇸🇰 SK (+421)</option>
                <option value="+380">🇺🇦 UA (+380)</option>
                <option value="+33">🇫🇷 FR (+33)</option>
                <option value="+39">🇮🇹 IT (+39)</option>
                <option value="+34">🇪🇸 ES (+34)</option>
                <option value="+31">🇳🇱 NL (+31)</option>
                <option value="+47">🇳🇴 NO (+47)</option>
                <option value="+46">🇸🇪 SE (+46)</option>
                <option value="+45">🇩🇰 DK (+45)</option>
                <option value="+358">🇫🇮 FI (+358)</option>
                <option value="+43">🇦🇹 AT (+43)</option>
                <option value="+41">🇨🇭 CH (+41)</option>
                <option value="+32">🇧🇪 BE (+32)</option>
                <option value="+1">🇺🇸 US (+1)</option>
                <option value="+971">🇦🇪 AE (+971)</option>
                <option value="">🌐 Inny (+)</option>
            </select>

    const postChat = async (payload, attempt = 0) => {
        const res = await fetch('/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
        });
        if (!res.ok) {
            if (attempt < 2 && [502, 503, 504, 429].includes(res.status)) {
                await wait(1800 * (attempt + 1));
                return postChat(payload, attempt + 1);
            }
            throw new Error(`HTTP ${res.status}`);
        }
        let data;
        try {
            data = await res.json();
        } catch (e) {
            throw new Error('invalid_json');
        }
        if (!data || typeof data.answer !== 'string') {
            throw new Error('missing_answer');
        }
        return data;
    };

    const postChatStream = async (payload, onChunk) => {
        const res = await fetch('/chat/stream', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
        });
        if (!res.ok) {
            const data = await postChat(payload);
            onChunk(data.answer);
            return;
        }
        const reader = res.body.getReader();
        const decoder = new TextDecoder('utf-8');
        let buffer = '';

        while (true) {
            const { value, done } = await reader.read();
            if (done) break;
            buffer += decoder.decode(value, { stream: true });
            const lines = buffer.split('\n');
            buffer = lines.pop() || '';

            for (const line of lines) {
                const trimmed = line.trim();
                if (!trimmed.startsWith('data:')) continue;
                const dataStr = trimmed.slice(5).trim();
                if (dataStr === '[DONE]') {
                    return;
                }
                try {
                    const parsed = JSON.parse(dataStr);
                    if (parsed && typeof parsed.chunk === 'string') {
                        onChunk(parsed.chunk);
                    }
                } catch (e) {
                    // Ignore JSON parsing errors for partial/malformed frames
                }
            }
        }
    };

        const hasUserMsg = (state.messages || []).some((m) => m && m.role === 'user');

    const SKU_PATTERN = /\b([A-Z]{2,}(?:-[A-Z0-9][A-Z0-9\-/,\.]{1,})+)\b/g;

    const highlightSkuInElement = (el) => {
        if (!el || el.closest('code, pre, .sku-tag, .part-card, button')) return;
        const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
        const textNodes = [];
        while (walker.nextNode()) textNodes.push(walker.currentNode);
        textNodes.forEach((node) => {
            const text = node.nodeValue || '';
            if (!SKU_PATTERN.test(text)) {
                SKU_PATTERN.lastIndex = 0;
                return;
            }
            SKU_PATTERN.lastIndex = 0;
            const frag = document.createDocumentFragment();
            let lastIndex = 0;
            let match;
            while ((match = SKU_PATTERN.exec(text)) !== null) {
                if (match.index > lastIndex) {
                    frag.appendChild(document.createTextNode(text.slice(lastIndex, match.index)));
                }
                const code = document.createElement('code');
                code.className = 'sku-tag';
                code.textContent = match[1];
                frag.appendChild(code);
                lastIndex = match.index + match[0].length;
            }
            if (lastIndex < text.length) {
                frag.appendChild(document.createTextNode(text.slice(lastIndex)));
            }
            node.parentNode.replaceChild(frag, node);
        });
    };

    const enhanceBotMarkdown = (root) => {

    if (window.marked && typeof marked.setOptions === 'function') {
        marked.setOptions({ breaks: true, gfm: true });
    }

    /** Upewnij się, że GFM-tabele mają pustą linię przed sobą i LF (nie CRLF / dosłowne \\n). */
    const normalizeMarkdownTables = (markdownText) => {
        let md = String(markdownText || '');
        // Czasem JSON/proxy zostawia dosłowne "\n" zamiast prawdziwych linebreaków
        if (md.includes('\\n') && !md.includes('\n')) {
            md = md.replace(/\\n/g, '\n');
        }
        md = md.replace(/\r\n?/g, '\n');
        // Pusta linia przed tabelą (wymagane przez część parserów przy breaks:true)
        md = md.replace(/([^\n|])\n(\|[^\n]+\|)\n(\|[\s:|-]+\|)/g, '$1\n\n$2\n$3');
        return md;
    };

    /** Parsuj surowy blok | a | b | gdy marked zostawił go w <p>. */
    const parsePipeTableBlock = (text) => {
        const lines = String(text || '')
            .split('\n')
            .map((l) => l.trim())
            .filter(Boolean);
        if (lines.length < 2) return null;
        const isRow = (l) => /^\|(.+)\|$/.test(l) || (/\|/.test(l) && l.split('|').length >= 3);
        const isSep = (l) => /^\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?$/.test(l);
        let start = lines.findIndex((l) => isRow(l) && l.includes('|'));
        if (start < 0) return null;
        // znajdź separator w sąsiedztwie
        let sepIdx = -1;
        for (let i = start; i < Math.min(start + 3, lines.length); i++) {
            if (isSep(lines[i])) {
                sepIdx = i;
                break;
            }
        }
        if (sepIdx < 0) return null;
        const headerLine = sepIdx > start ? lines[sepIdx - 1] : lines[start];
        const splitCells = (line) => {
            let s = line.trim();
            if (s.startsWith('|')) s = s.slice(1);
            if (s.endsWith('|')) s = s.slice(0, -1);
            return s.split('|').map((c) => c.trim());
        };
        const headers = splitCells(headerLine);
        if (headers.length < 2) return null;
        const rows = [];
        for (let i = sepIdx + 1; i < lines.length; i++) {
            if (!isRow(lines[i]) || isSep(lines[i])) break;
            const cells = splitCells(lines[i]);
            if (cells.every((c) => !c)) continue;
            while (cells.length < headers.length) cells.push('');
            rows.push(cells.slice(0, headers.length));
        }
        if (!rows.length) return null;
        const table = document.createElement('table');
        const thead = document.createElement('thead');
        const hr = document.createElement('tr');
        headers.forEach((h) => {
            const th = document.createElement('th');
            th.textContent = h;
            hr.appendChild(th);
        });
        thead.appendChild(hr);
        table.appendChild(thead);
        const tbody = document.createElement('tbody');
        rows.forEach((cells) => {
            const tr = document.createElement('tr');
            cells.forEach((c) => {
                const td = document.createElement('td');
                td.textContent = c;
                tr.appendChild(td);
            });
            tbody.appendChild(tr);
        });
        table.appendChild(tbody);
        return table;
    };

    const rescuePipeTables = (root) => {
        const candidates = Array.from(root.querySelectorAll('p, pre, code'));
        candidates.forEach((el) => {
            const text = el.textContent || '';
            if (!text.includes('|') || !/\|[\s:|-]+\|/.test(text)) return;
            // Gdy marked wrzucił table-as-paragraph z <br>, znormalizuj
            const normalized = text.replace(/\u00a0/g, ' ');
            const table = parsePipeTableBlock(normalized);
            if (!table) return;
            // Zachowaj tekst przed tabelą (intro w tym samym <p>)
            const before = normalized.split('\n').filter((l) => l.trim() && !l.includes('|'));
            const frag = document.createDocumentFragment();
            if (before.length) {
                const p = document.createElement('p');
                p.textContent = before.join(' ').trim();
                frag.appendChild(p);
            }
            frag.appendChild(table);
            el.replaceWith(frag);
        });
    };

    const buildHandoffCard = (machine) => {

    const buildMachineCardsGrid = (tags) => {
