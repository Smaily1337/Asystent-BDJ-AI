<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Blue Dragon Jet | Konfigurator Części Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/marked@4.3.0/marked.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>

        :root {
            --brand-primary: #0f172a; /* Slate 900 */
            --brand-primary-hover: #1e293b; /* Slate 800 */
            --brand-accent: #3b82f6; /* Blue 500 */
            --bg-body: transparent;
            --bg-widget: rgba(255, 255, 255, 0.98);
            --border-light: #e2e8f0;
            --border-focus: #3b82f6;
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --shadow-premium: 0 24px 48px -12px rgba(15, 23, 42, 0.18), 0 0 0 1px rgba(15, 23, 42, 0.05);
            --shadow-card: 0 2px 8px rgba(15, 23, 42, 0.04);
            --font-main: 'Plus Jakarta Sans', sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-main); }
        body { background: var(--bg-body) !important; height: 100vh; overflow: hidden; font-size: 14px; color: var(--text-dark); }

        /* --- FAB BUTTON (Pływający przycisk Konfiguratora) --- */
        #fab-btn {
            position: fixed; bottom: 28px; right: 28px; width: 60px; height: 60px;
            background: var(--brand-primary);
            border-radius: 20px; box-shadow: 0 10px 24px -6px rgba(15, 23, 42, 0.4);
            display: flex; align-items: center; justify-content: center; color: white;
            cursor: pointer; z-index: 9999; border: 1px solid rgba(255, 255, 255, 0.1); outline: none;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        #fab-btn:hover { transform: translateY(-3px) scale(1.02); box-shadow: 0 14px 28px -4px rgba(15, 23, 42, 0.5); }
        #fab-btn:active { transform: translateY(0) scale(0.98); }
        #fab-btn svg { width: 26px; height: 26px; transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
        #fab-btn .icon-close { display: none; }
        #fab-btn.open .icon-chat { display: none; }
        #fab-btn.open .icon-close { display: block; transform: rotate(90deg); }

        /* --- GŁÓWNY WIDGET (Konfigurator Części) --- */
        #chat-widget {
            position: fixed; bottom: 100px; right: 28px; 
            width: min(440px, calc(100vw - 36px)); /* Większa spójność i szerokość w stylu intercomu */
            height: min(780px, calc(100vh - 130px)); 
            background: var(--bg-widget); 
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-radius: 24px; 
            box-shadow: var(--shadow-premium);
            z-index: 9998;
            display: flex; flex-direction: column; overflow: hidden; 
            opacity: 0; transform: translateY(24px) scale(0.96); 
            pointer-events: none; transform-origin: bottom right;
            transition: opacity 0.35s cubic-bezier(0.16, 1, 0.3, 1), transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }
        #chat-widget.open { opacity: 1; transform: translateY(0) scale(1); pointer-events: all; }
        
        /* Usunięto przestarzałe i krzykliwe efekty neonowe */

        @media (max-width: 680px) {
            #chat-widget {
                bottom: 0 !important; right: 0 !important; left: 0 !important; top: 0 !important;
                width: 100vw !important; height: 100vh !important; max-height: 100vh !important;
                border-radius: 0 !important; border: none !important;
            }
            #fab-btn { bottom: 18px; right: 18px; border-radius: 50%; }
        }

        /* --- NAGŁÓWEK KONFIGURATORA --- */
        .widget-header { 
            padding: 20px 24px; background: rgba(255, 255, 255, 0.85); 
            backdrop-filter: blur(12px); border-bottom: 1px solid var(--border-light); 
            display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; 
        }
        .header-brand { display: flex; align-items: center; gap: 14px; }
        .brand-badge { 
            width: 44px; height: 44px; border-radius: 14px; 
            background: #f8fafc; border: 1px solid var(--border-light);
            display: flex; align-items: center; justify-content: center; 
            overflow: hidden; flex-shrink: 0; box-shadow: var(--shadow-card);
        }
        .brand-badge img { width: 100%; height: 100%; object-fit: cover; }
        
        .brand-titles .title { font-size: 1.1rem; font-weight: 800; color: var(--text-dark); display: block; letter-spacing: -0.2px; }
        .brand-titles .subtitle { font-size: 0.8rem; font-weight: 600; color: var(--text-muted); display: block; margin-top: 2px; }
        
        .header-actions { display: flex; gap: 8px; align-items: center; }
        .btn-reset { 
            background: transparent; border: 1px solid transparent; padding: 6px 12px; 
            border-radius: 10px; cursor: pointer; font-size: 0.8rem; font-weight: 700; 
            color: var(--text-muted); display: inline-flex; align-items: center; gap: 6px;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1); 
        }
        .btn-reset:hover { background: #f1f5f9; color: var(--text-dark); border-color: var(--border-light); }
        .btn-close { background: none; border: none; font-size: 1.5rem; color: var(--text-muted); cursor: pointer; line-height: 1; padding: 4px; border-radius: 8px; transition: background 0.2s; }
        .btn-close:hover { background: #f1f5f9; color: var(--text-dark); }

        /* --- OBSZAR WIADOMOŚCI I KATALOGU --- */
        #chat-history { 
            flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 20px; scroll-behavior: smooth; 
            background: #f8fafc;
        }
        #chat-history::-webkit-scrollbar { width: 6px; }
        #chat-history::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }

        /* BANNER POCZĄTKOWY */
        .hero-banner { text-align: center; margin-bottom: 12px; animation: popIn 0.4s cubic-bezier(0.16, 1, 0.3, 1); padding: 12px 0; }
        .hero-title { font-size: 1.35rem; font-weight: 800; color: var(--text-dark); margin-bottom: 8px; letter-spacing: -0.3px; }
        .hero-subtitle { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 24px; line-height: 1.5; }
        
        .quick-action-card { 
            background: #ffffff; border: 1px solid var(--border-light); border-radius: 16px; 
            padding: 16px; cursor: pointer; display: flex; align-items: center; gap: 16px; 
            text-align: left; transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1); 
            box-shadow: var(--shadow-card);
        }
        .quick-action-card:hover { border-color: var(--brand-accent); transform: translateY(-2px); box-shadow: 0 8px 20px -6px rgba(59, 130, 246, 0.15); }
        .quick-action-card .icon { 
            width: 42px; height: 42px; background: #eff6ff; border-radius: 12px; 
            display: flex; align-items: center; justify-content: center; color: var(--brand-accent); 
            flex-shrink: 0; transition: transform 0.2s ease;
        }
        .quick-action-card:hover .icon { transform: scale(1.05); background: var(--brand-accent); color: white; }
        .quick-action-card .text strong { display: block; color: var(--text-dark); font-size: 0.95rem; font-weight: 700; margin-bottom: 2px; }
        .quick-action-card .text span { color: var(--text-muted); font-size: 0.85rem; }

        /* --- KARTY WIADOMOŚCI --- */
        .msg-row { display: flex; gap: 12px; max-width: 96%; animation: popIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .msg-row.user { align-self: flex-end; flex-direction: row-reverse; }
        .msg-row.bot { align-self: flex-start; width: 100%; }
        
        .avatar { 
            width: 32px; height: 32px; border-radius: 10px; 
            background: #f8fafc; border: 1px solid var(--border-light);
            display: flex; align-items: center; justify-content: center; 
            flex-shrink: 0; align-self: flex-end; margin-bottom: 2px;
            overflow: hidden;
        }
        .avatar img { width: 100%; height: 100%; object-fit: cover; }
        .msg-row.user .avatar { display: none; }
        
        .bubble { 
            padding: 14px 18px; border-radius: 20px; font-size: 0.95rem; line-height: 1.5; 
            color: var(--text-dark); background: #ffffff; border: 1px solid var(--border-light);
            word-wrap: break-word; box-shadow: var(--shadow-card);
        }
        .msg-row.user .bubble { 
            background: var(--brand-primary); color: white; border: none; 
            border-bottom-right-radius: 4px; box-shadow: 0 4px 12px -2px rgba(15, 23, 42, 0.2); 
        }
        .msg-row.bot .bubble { border-bottom-left-radius: 4px; width: 100%; }

        /* --- TABELE CZĘŚCI --- */
        .table-wrapper { 
            width: 100%; overflow-x: auto; margin: 16px 0; border: 1px solid var(--border-light); 
            border-radius: 14px; background: #ffffff; box-shadow: 0 2px 8px rgba(15, 23, 42, 0.02); 
        }
        .table-wrapper::-webkit-scrollbar { height: 5px; }
        .table-wrapper::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        
        .bubble table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        .bubble th, .bubble td { padding: 12px 14px; border-bottom: 1px solid #f1f5f9; text-align: left; }
        .bubble th { background: #f8fafc; font-weight: 700; color: #475569; white-space: nowrap; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.5px; }
        
        .bubble tbody tr { cursor: pointer; transition: background 0.2s; }
        .bubble tbody tr:hover { background: #f8fafc; }
        .bubble tbody tr.selected-row { 
            background: #eff6ff !important; border-left: 3px solid var(--brand-accent); 
        }
        .offer-checkbox { width: 18px; height: 18px; cursor: pointer; accent-color: var(--brand-accent); border-radius: 4px; }

        .btn-quote { 
            background: white; color: var(--brand-primary); border: 1px solid var(--border-light); 
            padding: 10px 18px; border-radius: 12px; font-weight: 700; font-size: 0.9rem; 
            cursor: pointer; margin-top: 14px; transition: all 0.2s ease; box-shadow: var(--shadow-card);
        }
        .btn-quote:hover { border-color: var(--brand-primary); background: #f8fafc; transform: translateY(-1px); }

        /* --- BAR WYSYŁANIA OFERTY --- */
        #offer-action-bar { 
            background: var(--brand-primary); color: white; padding: 14px 24px; 
            display: none; align-items: center; justify-content: space-between; flex-shrink: 0;
            animation: slideUp 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }
        #offer-action-bar span { font-weight: 600; font-size: 0.9rem; }
        #btn-open-modal { 
            background: white; color: var(--brand-primary); border: none; padding: 8px 16px; 
            border-radius: 10px; font-weight: 700; font-size: 0.85rem; cursor: pointer; 
            transition: all 0.2s ease;
        }
        #btn-open-modal:hover { transform: scale(1.02); }

        /* --- FOOTER INPUT --- */
        .widget-footer { 
            padding: 16px 20px; background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px);
            border-top: 1px solid var(--border-light); flex-shrink: 0; 
        }
        .input-group { 
            display: flex; align-items: flex-end; background: #f1f5f9; border: 1px solid transparent; 
            border-radius: 20px; padding: 10px 14px 10px 18px; transition: all 0.2s ease; 
        }
        .input-group:focus-within { background: #ffffff; border-color: var(--brand-accent); box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15); }
        #chat-input { flex: 1; border: none; background: transparent; outline: none; font-size: 0.95rem; resize: none; min-height: 24px; max-height: 120px; color: var(--text-dark); padding-top: 2px; }
        #btn-send { 
            width: 36px; height: 36px; border-radius: 12px; border: none; 
            background: var(--brand-primary); color: white; display: flex; align-items: center; justify-content: center; 
            cursor: pointer; transition: all 0.2s ease; flex-shrink: 0; margin-left: 10px; 
        }
        #btn-send:hover:not(:disabled) { background: var(--brand-primary-hover); transform: scale(1.05); }
        #btn-send:disabled { background: #cbd5e1; cursor: default; }

        .disclaimer-text { font-size: 0.73rem; color: var(--text-muted); text-align: center; margin-top: 10px; }

        /* --- TYPING INDICATOR --- */
        .typing { display: flex; gap: 5px; padding: 6px 4px; align-items: center; }
        .dot { width: 6px; height: 6px; background: #94a3b8; border-radius: 50%; animation: bounce 1.4s infinite ease-in-out both; }
        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }
        
        /* --- MODAL KONTAKTOWY --- */
        .modal-overlay { 
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(15, 23, 42, 0.4); z-index: 10000; justify-content: center; align-items: center; 
            animation: fadeIn 0.25s ease; backdrop-filter: blur(4px); 
        }
        .modal-box { background: #fff; padding: 32px; border-radius: 24px; width: 90%; max-width: 420px; box-shadow: var(--shadow-premium); border: 1px solid var(--border-light); }
        .modal-box h2 { font-size: 1.25rem; font-weight: 800; margin-bottom: 16px; color: var(--text-dark); }
        #modal-selected-preview { 
            margin-bottom: 20px; font-size: 0.85rem; color: #334155; background: #f8fafc; border-radius: 12px; border: 1px solid var(--border-light); padding: 12px 16px; max-height: 140px; overflow-y: auto; 
        }
        #modal-selected-preview ul { margin-left: 18px; margin-top: 6px; }
        .modal-box input { width: 100%; padding: 14px 16px; margin-bottom: 14px; border: 1px solid var(--border-light); border-radius: 14px; outline: none; background: #f8fafc; font-size: 0.95rem; transition: all 0.2s; }
        .modal-box input:focus { border-color: var(--brand-accent); background: #fff; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1); }
        .modal-footer { display: flex; justify-content: flex-end; gap: 12px; margin-top: 12px; }
        .btn-cancel { padding: 12px 20px; border-radius: 12px; border: 1px solid var(--border-light); background: #fff; color: var(--text-dark); font-weight: 700; cursor: pointer; transition: background 0.2s; }
        .btn-cancel:hover { background: #f1f5f9; }
        .btn-submit { padding: 12px 24px; border-radius: 12px; border: none; background: var(--brand-primary); color: white; font-weight: 700; cursor: pointer; transition: background 0.2s; }
        .btn-submit:hover { background: var(--brand-primary-hover); }

        /* --- FLOATING TOOLTIP --- */
        .fab-tooltip {
            position: fixed; bottom: 100px; right: 28px;
            background: #ffffff; border: 1px solid var(--border-light);
            border-radius: 16px; padding: 12px 16px;
            box-shadow: 0 12px 24px -6px rgba(15, 23, 42, 0.15);
            display: flex; align-items: center; gap: 12px;
            z-index: 9997; cursor: pointer;
            opacity: 0; transform: translateY(16px) scale(0.95);
            pointer-events: none; transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .fab-tooltip.show { opacity: 1; transform: translateY(0) scale(1); pointer-events: all; }
        .fab-tooltip:hover { transform: translateY(-2px) scale(1.02); box-shadow: 0 16px 32px -4px rgba(15, 23, 42, 0.2); }
        .tooltip-avatar { width: 36px; height: 36px; border-radius: 10px; background: #f8fafc; border: 1px solid var(--border-light); flex-shrink: 0; overflow: hidden; }
        .tooltip-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .tooltip-content strong { display: block; font-size: 0.85rem; color: var(--text-dark); font-weight: 700; }
        .tooltip-content span { font-size: 0.8rem; color: var(--text-muted); line-height: 1.3; display: block; }
        #tooltip-close { background: none; border: none; font-size: 1.2rem; color: #cbd5e1; cursor: pointer; padding: 0 2px; margin-left: 4px; align-self: flex-start; line-height: 1; transition: color 0.2s; }
        #tooltip-close:hover { color: var(--text-dark); }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes popIn { from { opacity: 0; transform: translateY(12px) scale(0.97); } to { opacity: 1; transform: translateY(0) scale(1); } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); opacity: 0.4; } 40% { transform: scale(1); opacity: 1; } }

    </style>
</head>
<body>

<!-- FLOATING TOOLTIP / CHMURKA ZACHĘCAJĄCA (Po 3 sekundach) -->
<div id="fab-tooltip" class="fab-tooltip">
    <div class="tooltip-avatar"><img src="avatar.png" alt="Dragon AI" /></div>
    <div class="tooltip-content">
        <strong>DRAGON AI</strong>
        <span>Cześć! Chętnie pomogę Ci w doborze części 😊</span>
    </div>
    <button id="tooltip-close" aria-label="Zamknij">&times;</button>
</div>

<!-- FAB BUTTON -->
<button id="fab-btn" aria-label="Otwórz Konfigurator Części">
    <svg class="icon-chat" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
    <svg class="icon-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
</button>

<!-- WIDGET KONFIGURATORA -->
<div id="chat-widget">
    <header class="widget-header">
        <div class="header-brand">
            <div class="brand-badge"><img src="avatar.png" alt="Dragon AI" /></div>
            <div class="brand-titles">
                <span class="title">DRAGON AI</span>
                <span class="subtitle">Twój wirtualny asystent</span>
            </div>
        </div>
        <div class="header-actions">
            <button class="btn-reset" id="btn-reset" title="Wyczyść historię rozmowy">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" width="14" height="14"><path d="M3 6h18"></path><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                Wyczyść czat
            </button>
            <button class="btn-close" id="btn-close">&times;</button>
        </div>
    </header>

    <main id="chat-history">
        <!-- Renderowane przez JS -->
    </main>

    <div id="offer-action-bar">
        <span>Wybrane części (<b id="offer-count">0</b>):</span>
        <button id="btn-open-modal">Wygeneruj zapytanie</button>
    </div>

    <footer class="widget-footer">
        <div class="input-group">
            <textarea id="chat-input" rows="1" placeholder="Opisz potrzebną część lub podaj model i wymiar..."></textarea>
            <button id="btn-send" disabled>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="18" height="18"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
            </button>
        </div>
        <div class="disclaimer-text">System automatycznego doboru komponentów BDJ. Weryfikuj wymiary przed zamówieniem.</div>
    </footer>
</div>

<!-- MODAL KONTAKTOWY -->
<div class="modal-overlay" id="modal-contact">
    <div class="modal-box">
        <h2>Zapytanie Ofertowe</h2>
        <div id="modal-selected-preview"></div>
        <input type="text" id="inp-company" placeholder="Nazwa firmy *" required>
        <input type="email" id="inp-email" placeholder="Adres e-mail *" required>
        <input type="tel" id="inp-phone" placeholder="Numer telefonu *" required>
        <div class="modal-footer">
            <button class="btn-cancel" id="btn-cancel">Anuluj</button>
            <button class="btn-submit" id="btn-submit-offer">Wyślij zapytanie</button>
        </div>
    </div>
</div>

<!-- JAVASCRIPT LOGIKA -->
<script>
const BDJChatApp = (() => {
    let state = {
        messages: [],
        pendingMachine: null,
        sessionId: 'sess_' + Math.random().toString(36).substring(2, 10)
    };

    const DOM = {
        fab: document.getElementById('fab-btn'),
        widget: document.getElementById('chat-widget'),
        history: document.getElementById('chat-history'),
        input: document.getElementById('chat-input'),
        btnSend: document.getElementById('btn-send'),
        btnReset: document.getElementById('btn-reset'),
        btnClose: document.getElementById('btn-close'),
        offerBar: document.getElementById('offer-action-bar'),
        offerCount: document.getElementById('offer-count'),
        tooltip: document.getElementById('fab-tooltip'),
        tooltipClose: document.getElementById('tooltip-close'),
        btnOpenModal: document.getElementById('btn-open-modal'),
        modal: document.getElementById('modal-contact'),
        btnCancel: document.getElementById('btn-cancel'),
        btnSubmit: document.getElementById('btn-submit-offer')
    };

    const init = () => {
        loadState();
        renderHistory();
        bindEvents();
    };

    const saveState = () => {
        localStorage.setItem('bdj_chat_state', JSON.stringify(state));
    };

    const welcomeMessage = {
        role: 'bot',
        content: 'Cześć! Jestem <strong>DRAGON AI</strong> – Twój wirtualny asystent. W czym mogę Ci pomóc? 😊',
        raw: 'Cześć! Jestem DRAGON AI – Twój wirtualny asystent. W czym mogę Ci pomóc? 😊'
    };

    const loadState = () => {
        const saved = localStorage.getItem('bdj_chat_state');
        if (saved) {
            try { state = JSON.parse(saved); } catch (e) { state.messages = []; }
        }
        if (!state.sessionId) {
            state.sessionId = 'sess_' + Math.random().toString(36).substring(2, 10);
        }
        if (!state.messages || state.messages.length === 0) {
            state.messages = [welcomeMessage];
        }
    };

    const resetSession = async () => {
        if(confirm('Czy na pewno chcesz wyczyścić historię rozmowy i rozpocząć nową konwersację?')) {
            localStorage.removeItem('bdj_chat_state');
            state.sessionId = 'sess_' + Math.random().toString(36).substring(2, 10);
            state.messages = [welcomeMessage];
            DOM.offerBar.style.display = 'none';
            renderHistory();
            saveState();
            try {
                await fetch('http://127.0.0.1:8000/reset', { method: 'POST' });
            } catch(e) {}
        }
    };

    const renderHistory = () => {
        DOM.history.innerHTML = '';
        if (state.messages.length <= 1) {
            DOM.history.appendChild(createHeroBanner());
        }
        state.messages.forEach(msg => {
            DOM.history.appendChild(createMessageElement(msg.role, msg.content));
        });
        scrollToBottom();
        updateCheckboxesState();
    };

    const createHeroBanner = () => {
        const div = document.createElement('div');
        div.className = 'hero-banner';
        div.innerHTML = `
            <div class="hero-title">Witaj w DRAGON AI</div>
            <div class="hero-subtitle">Twój wirtualny asystent doboru części, uszczelek oraz osprzętu wdmuchiwarek Blue Dragon Jet.</div>
            <div class="quick-action-card" id="qa-parts">
                <div class="icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" width="22" height="22"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                </div>
                <div class="text">
                    <strong>Rozpocznij dobór części</strong>
                    <span>Podaj model maszyny (np. BDJ Mini, BDJ Nexta) oraz wymiary rurki lub kabla.</span>
                </div>
            </div>
        `;
        div.querySelector('#qa-parts').addEventListener('click', () => {
            DOM.input.value = "Potrzebuję dobrać część. Podaję model maszyny i wymiar:";
            resizeInput();
            DOM.input.focus();
        });
        return div;
    };

    const createMessageElement = (role, htmlContent) => {
        const row = document.createElement('div');
        row.className = `msg-row ${role}`;
        
        const avatar = document.createElement('div');
        avatar.className = 'avatar';
        avatar.innerHTML = '<img src="avatar.png" alt="BDJ Dragon" />';

        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.innerHTML = htmlContent;

        row.appendChild(avatar);
        row.appendChild(bubble);
        return row;
    };

    const showTypingIndicator = () => {
        const id = 'typing-' + Date.now();
        const row = createMessageElement('bot', '<div class="typing"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>');
        row.id = id;
        DOM.history.appendChild(row);
        scrollToBottom();
        return id;
    };

    const removeTypingIndicator = (id) => {
        const el = document.getElementById(id);
        if (el) el.remove();
    };

    const processBotResponse = (markdownText) => {
        const rawHTML = marked.parse(markdownText);
        const parser = new DOMParser();
        const doc = parser.parseFromString(rawHTML, 'text/html');

        doc.querySelectorAll('table').forEach(table => {
            const wrapper = document.createElement('div');
            wrapper.className = 'table-wrapper';
            table.parentNode.insertBefore(wrapper, table);
            wrapper.appendChild(table);

            const theadTr = table.querySelector('thead tr');
            if (theadTr) {
                const th = document.createElement('th');
                th.textContent = 'Wybór';
                th.style.textAlign = 'center';
                th.style.width = '55px';
                theadTr.insertBefore(th, theadTr.firstChild);
            }

            table.querySelectorAll('tbody tr').forEach(tr => {
                const rowData = Array.from(tr.querySelectorAll('td')).map(td => td.textContent.trim());
                
                const td = document.createElement('td');
                td.style.textAlign = 'center';
                
                const cb = document.createElement('input');
                cb.type = 'checkbox';
                cb.className = 'offer-checkbox';
                cb.dataset.itemData = JSON.stringify(rowData);
                
                td.appendChild(cb);
                tr.insertBefore(td, tr.firstChild);
            });
        });

        let finalHtml = doc.body.innerHTML;
        finalHtml = finalHtml.replace(/\[GET_QUOTE:\s*(.*?)\]/gi, (match, machine) => {
            return `<button class="btn-quote" data-machine="${match ? machine.trim() : ''}">Zapytaj o wycenę: ${machine.trim()}</button>`;
        });

        return finalHtml;
    };

    const sendMessage = async () => {
        const text = DOM.input.value.trim();
        if (!text) return;

        DOM.input.value = '';
        DOM.input.disabled = true;
        DOM.btnSend.disabled = true;
        resizeInput();

        state.messages.push({ role: 'user', content: text, raw: text });
        renderHistory();

        DOM.widget.classList.add('thinking-glow');
        const typingId = showTypingIndicator();

        try {
            const res = await fetch('http://127.0.0.1:8000/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ question: text, session_id: state.sessionId })
            });
            const data = await res.json();
            const formattedHTML = processBotResponse(data.answer);
            
            removeTypingIndicator(typingId);
            state.messages.push({ role: 'bot', content: formattedHTML, raw: data.answer });
            renderHistory();
            saveState();

        } catch (error) {
            removeTypingIndicator(typingId);
            const errHtml = `<span style="color:#ef4444; font-weight:600;">Błąd połączenia z serwerem konfiguratora.</span>`;
            state.messages.push({ role: 'bot', content: errHtml, raw: 'Błąd' });
            renderHistory();
        } finally {
            DOM.widget.classList.remove('thinking-glow');
        }

        DOM.input.disabled = false;
        DOM.input.focus();
    };

    const submitOffer = async () => {
        const company = document.getElementById('inp-company').value.trim();
        const email = document.getElementById('inp-email').value.trim();
        const phone = document.getElementById('inp-phone').value.trim();

        if (!company || !email || !phone) return alert("Proszę wypełnić wszystkie wymagane pola.");

        const checkedBoxes = document.querySelectorAll('.offer-checkbox:checked');
        const items = Array.from(checkedBoxes).map(cb => JSON.parse(cb.dataset.itemData));

        closeModal();
        DOM.offerBar.style.display = 'none';

        let itemsSummary = "";
        if (items.length > 0) {
            itemsSummary = "<br><ul style='margin-left:16px; margin-top:6px;'>" + items.map(item => `<li>${item.filter(x => x && x !== 'Wybór').join(' | ')}</li>`).join('') + "</ul>";
        }

        const successMsg = `Wysłano zapytanie ofertowe dla firmy <strong>${company}</strong>.${itemsSummary}<br>Potwierdzenie zostanie przesłane na: <em>${email}</em> / tel. <em>${phone}</em>.`;
        state.messages.push({ role: 'bot', content: successMsg, raw: successMsg });
        renderHistory();
        saveState();

        try {
            await fetch('http://127.0.0.1:8000/offer', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ company, email, phone, items, machine: state.pendingMachine || "Dobór części" })
            });
        } catch(e) { console.error("Błąd wysyłki zgłoszenia", e); }
        
        state.pendingMachine = null;
    };

    const updateCheckboxesState = () => {
        const checkboxes = document.querySelectorAll('.offer-checkbox');
        let count = 0;
        checkboxes.forEach(cb => {
            const tr = cb.closest('tr');
            if (cb.checked) {
                count++;
                if (tr) tr.classList.add('selected-row');
            } else {
                if (tr) tr.classList.remove('selected-row');
            }
        });
        DOM.offerCount.textContent = count;
        DOM.offerBar.style.display = count > 0 ? 'flex' : 'none';
    };

    const openModal = () => {
        const preview = document.getElementById('modal-selected-preview');
        const checkedBoxes = document.querySelectorAll('.offer-checkbox:checked');
        if (checkedBoxes.length > 0) {
            let html = `<strong>Wybrane pozycje do zapytania (${checkedBoxes.length}):</strong><ul>`;
            checkedBoxes.forEach(cb => {
                try {
                    const data = JSON.parse(cb.dataset.itemData);
                    const cleanData = data.filter(x => x && x !== 'Wybór');
                    html += `<li>${cleanData.join(' | ')}</li>`;
                } catch(e) {}
            });
            html += "</ul>";
            preview.innerHTML = html;
            preview.style.display = 'block';
        } else if (state.pendingMachine) {
            preview.innerHTML = `<strong>Dotyczy zapytania dla maszyny:</strong> ${state.pendingMachine}`;
            preview.style.display = 'block';
        } else {
            preview.style.display = 'none';
        }
        DOM.modal.style.display = 'flex';
    };

    const closeModal = () => { DOM.modal.style.display = 'none'; };

    const bindEvents = () => {
        // Po 3 sekundach pokazujemy zachęcającą chmurkę nad FAB
        setTimeout(() => {
            if (!DOM.widget.classList.contains('open')) {
                DOM.tooltip.classList.add('show');
            }
        }, 3000);

        DOM.tooltip.addEventListener('click', (e) => {
            if (e.target.id === 'tooltip-close') {
                e.stopPropagation();
                DOM.tooltip.classList.remove('show');
            } else {
                DOM.tooltip.classList.remove('show');
                DOM.widget.classList.add('open');
                DOM.fab.classList.add('open');
                DOM.input.focus();
            }
        });

        DOM.fab.addEventListener('click', () => {
            DOM.tooltip.classList.remove('show');
            DOM.widget.classList.toggle('open');
            DOM.fab.classList.toggle('open');
            if(DOM.widget.classList.contains('open')) DOM.input.focus();
        });
        DOM.btnClose.addEventListener('click', () => {
            DOM.widget.classList.remove('open');
            DOM.fab.classList.remove('open');
        });
        DOM.btnReset.addEventListener('click', resetSession);

        if (DOM.btnOpenSliders) {
            DOM.btnOpenSliders.addEventListener('click', () => {
                const card = createSliderCard();
                DOM.history.appendChild(card);
                scrollToBottom();
            });
        }

        DOM.input.addEventListener('input', () => {
            resizeInput();
            DOM.btnSend.disabled = DOM.input.value.trim().length === 0;
        });
        DOM.input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                if (!DOM.btnSend.disabled) sendMessage();
            }
        });
        DOM.btnSend.addEventListener('click', sendMessage);

        DOM.history.addEventListener('click', (e) => {
            const tr = e.target.closest('tbody tr');
            if (tr) {
                const cb = tr.querySelector('.offer-checkbox');
                if (cb && e.target !== cb) {
                    cb.checked = !cb.checked;
                    updateCheckboxesState();
                }
            }
            if (e.target.classList.contains('btn-quote')) {
                state.pendingMachine = e.target.dataset.machine;
                openModal();
            }
        });

        DOM.history.addEventListener('change', (e) => {
            if (e.target.classList.contains('offer-checkbox')) {
                updateCheckboxesState();
            }
        });

        DOM.btnOpenModal.addEventListener('click', () => { openModal(); });
        DOM.btnCancel.addEventListener('click', closeModal);
        DOM.btnSubmit.addEventListener('click', submitOffer);
    };

    const resizeInput = () => {
        DOM.input.style.height = '24px';
        DOM.input.style.height = Math.min(DOM.input.scrollHeight, 120) + 'px';
    };
    const scrollToBottom = () => { DOM.history.scrollTop = DOM.history.scrollHeight; };

    return { init };
})();

document.addEventListener('DOMContentLoaded', BDJChatApp.init);
</script>
</body>
</html>
